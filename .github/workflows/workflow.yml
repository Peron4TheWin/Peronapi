name: Sync & Extract LUAs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forzar extracción completa de todos los ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore last SHA
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-upstream-sha

      - name: Check upstream for new commits
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          UPSTREAM_SHA=$(curl -sf \
            "https://api.github.com/repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/commits/main" \
            | jq -r '.sha')

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")

          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "last=$LAST_SHA"         >> $GITHUB_OUTPUT

          echo "SHA upstream:  $UPSTREAM_SHA"
          echo "SHA guardado:  $LAST_SHA"

          if [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Hay cambios, continuando..."
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Sin cambios, saliendo."
          fi

      - name: Sync fork with upstream
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git"

          echo "Fetching upstream..."
          git fetch upstream main

          echo "Mergeando..."
          git merge upstream/main --ff-only || git merge upstream/main --no-edit

          echo "✓ Fork sincronizado"

      - name: Detect changed ZIPs
        if: steps.check.outputs.changed == 'true'
        id: zips
        run: |
          LAST="${{ steps.check.outputs.last }}"
          FULL="${{ inputs.full_sync }}"

          if [ -z "$LAST" ] || [ "$FULL" = "true" ]; then
            echo "Modo: sync completo"
            find . -name "*.zip" -not -path "./.git/*" > /tmp/changed_zips.txt
          else
            echo "Modo: sync incremental"
            git diff --name-only --diff-filter=ACM "$LAST" HEAD \
              | grep '\.zip$' > /tmp/changed_zips.txt
          fi

          COUNT=$(wc -l < /tmp/changed_zips.txt)
          echo "==============================="
          echo "ZIPs a procesar: $COUNT"
          echo "==============================="
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Extract and patch LUAs
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          mkdir -p /tmp/luas

          TOTAL=$(wc -l < /tmp/changed_zips.txt)
          COUNT=0
          SKIPPED=0

          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue

            COUNT=$((COUNT + 1))
            appid=$(basename "$zipfile" .zip)

            echo "[$COUNT/$TOTAL] Extrayendo $appid..."

            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            luafile=$(find "$tmpdir" -name "*.lua" | head -1)
            if [ -z "$luafile" ]; then
              echo "  ⚠ Sin lua, saltando"
              SKIPPED=$((SKIPPED + 1))
              rm -rf "$tmpdir"
              continue
            fi

            sed -i 's/^\(setManifestid(.*)\)/-- \1/' "$luafile"
            cp "$luafile" "/tmp/luas/${appid}.lua"
            rm -rf "$tmpdir"

            echo "  ✓ Parchado y guardado"

          done < /tmp/changed_zips.txt

          PROCESADOS=$(ls /tmp/luas | wc -l)
          echo ""
          echo "==============================="
          echo "Total ZIPs:    $TOTAL"
          echo "Procesados:    $PROCESADOS"
          echo "Saltados:      $SKIPPED"
          echo "==============================="

      - name: Push LUAs to branch
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout luas 2>/dev/null || git checkout -b luas

          ANTES=$(git ls-files "*.lua" | wc -l)
          echo "LUAs en rama antes: $ANTES"

          cp /tmp/luas/*.lua ./

          NUEVOS=$(ls /tmp/luas/*.lua | wc -l)
          echo "LUAs copiados: $NUEVOS"

          git add *.lua

          STAGED=$(git diff --cached --name-only | wc -l)
          echo "Archivos con cambios: $STAGED"

          git commit -m "sync: update LUAs ($STAGED archivos)" || echo "Nada nuevo para commitear"

          echo "Pusheando a rama luas..."
          git push origin luas --force

          DESPUES=$(git ls-files "*.lua" | wc -l)
          echo ""
          echo "==============================="
          echo "LUAs antes:    $ANTES"
          echo "LUAs subidos:  $NUEVOS"
          echo "Cambiados:     $STAGED"
          echo "Total en rama: $DESPUES"
          echo "==============================="

      - name: Save new SHA to cache
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ SHA guardado"
